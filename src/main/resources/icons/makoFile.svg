  <path d="M2 2 L10 2 L14 6 L14 15 L2 15 Z" fill="#6E6E6E" fill-opacity="0.40" stroke="#6E6E6E" stroke-opacity="0.5" stroke-width="0.5"/>
  <!-- Folded corner triangle -->
  <path d="M10 2 L14 6 L10 6 Z" fill="#6E6E6E" fill-opacity="0.25"/>
  <line x1="10" y1="2" x2="10" y2="6" stroke="#6E6E6E" stroke-opacity="0.5" stroke-width="0.5"/>
  <!-- Stylized "M" letter centered on file shape -->
